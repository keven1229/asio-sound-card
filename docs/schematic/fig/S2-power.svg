  <!-- 标题块 -->
  <rect class="w" x="40" y="640" width="1360" height="300"/>
  <text class="tt" x="60" y="665">上电顺序 / 检查点</text>
  <text class="t" x="60" y="690">上电：V5D → (V3V3D / V1V8 最早组) → (V0V9 / V3V6→V3V3D / ±5VA / V3V3A) → ESP32 读 PG → 使能 XL6019(缓启) → 100ms → 闭 K1(幻象)</text>
  <text class="t" x="60" y="712">断电：开 K3(静音) → 音量 ramp -60dB → 开 K1 → 关 XL6019；常开继电器天然断开兜底</text>
  <text class="t" x="60" y="734">⚠ 红线：XL6019/SY8089×2 的 SW 环路最小、远离 PGA2500 与 ES9822；V3V3A 走线不穿越开关电源区</text>
  <text class="t" x="60" y="756">⚠ GM1205 与 LT3045 pin-to-pin 兼容（SET=100µA），ILIM 电阻按 GM1205 手册；LDO 输出按 datasheet 用 MLCC（现代 LDO 陶瓷稳定，固态无收益不必要）</text>
  <text class="t" x="60" y="778">⚠ V3V3D 两级降压：U2B(3.6V)→U3(3.3V)，LDO 功耗 0.18W 无散热焦虑；1.2MHz 纹波被 LDO PSRR 压制</text>
  <text class="t" x="60" y="800">功率预算：典型 0.91A / 峰值 1.56A @5V；USB 描述符 500mA，实际依赖 PC 口过流能力，JDC 备份可选</text>
  <text class="tt" x="60" y="830">S2 电源树 — ASIO-CARD v1 | 引脚号核对以 datasheet 为准</text>
</svg>
