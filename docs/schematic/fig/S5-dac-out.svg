<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" font-family="Arial, sans-serif">
  <style>
    .w{stroke:#333;stroke-width:1.3;fill:none}
    .pw{stroke:#c00;stroke-width:2;fill:none}
    .t{font-size:10px;fill:#222}
    .tl{font-size:9px;fill:#555}
    .pn{font-size:9px;fill:#111;font-weight:bold}
    .ic{fill:#f6f8fa;stroke:#222;stroke-width:1.2}
    .nb{font-size:10px;fill:#c00;font-weight:bold}
    .nt{font-size:9px;fill:#333}
    .tt{font-size:15px;fill:#111;font-weight:900}
    .off{stroke:#06c;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
  </style>

  <text class="tt" x="40" y="30">S7+S8 DAC 与输出（ES9039Q2M / 线路 / 耳机）</text>

  <!-- Y20 100MHz -->
  <rect class="ic" x="60" y="60" width="150" height="60"/>
  <text class="pn" x="70" y="82">Y20 NZ2520SD 100MHz</text>
  <text class="tl" x="70" y="96">(V3V3A 供电=相噪地板)</text>
  <line class="w" x1="210" y1="90" x2="300" y2="90"/><text class="t" x="215" y="84">33Ω→MCLK</text>
  <line class="w" x1="135" y1="120" x2="135" y2="140"/>
  <path class="w" d="M120 140 h30 M126 147 h18 M129 154 h12"/><text class="t" x="142" y="165">GND</text>

  <!-- U20 ES9039Q2M -->
  <rect class="ic" x="300" y="100" width="250" height="200"/>
  <text class="pn" x="312" y="122">U20 ES9039Q2M</text>
  <text class="tl" x="312" y="136">(QFN-40, 供电脚名以9039手册为准)</text>
  <line class="w" x1="360" y1="100" x2="360" y2="76"/>
  <text class="t" x="365" y="86">MCLK(ASRC常开)</text>
  <line class="w" x1="420" y1="100" x2="420" y2="76"/><text class="nb" x="425" y="86">DVDD←V3V3D</text>
  <line class="w" x1="480" y1="100" x2="480" y2="76"/><text class="nb" x="485" y="86">AVCC_L/R,VCCA←V3V3A</text>
  <line class="off" x1="300" y1="150" x2="240" y2="150"/><text class="t" x="246" y="144">DAC_BCLK/LRCK/DIN ←S3</text>
  <line class="off" x1="300" y1="170" x2="240" y2="170"/><text class="t" x="246" y="164">I2C_SDA/SCL ↔S5</text>
  <line class="off" x1="300" y1="190" x2="240" y2="190"/><text class="t" x="246" y="184">RST_N ←S5</text>
  <line class="w" x1="550" y1="140" x2="600" y2="140"/><text class="t" x="554" y="134">OUT_L+</text>
  <line class="w" x1="550" y1="160" x2="600" y2="160"/><text class="t" x="554" y="154">OUT_L−</text>
  <line class="w" x1="550" y1="200" x2="600" y2="200"/><text class="t" x="554" y="194">OUT_R+</text>
  <line class="w" x1="550" y1="220" x2="600" y2="220"/><text class="t" x="554" y="214">OUT_R−</text>
  <line class="w" x1="430" y1="300" x2="430" y2="322"/>
  <path class="w" d="M415 322 h30 M421 329 h18 M424 336 h12"/><text class="t" x="437" y="316">GND</text>
  <text class="tl" x="312" y="316">音量:I2C写寄存器,0.5dB级,2ms/步ramp</text>

  <!-- 滤波 + 差转单（L 路） -->
  <line class="w" x1="600" y1="140" x2="640" y2="140"/>
  <rect class="ic" x="640" y="134" width="24" height="10"/><text class="tl" x="644" y="142">220</text>
  <line class="w" x1="664" y1="139" x2="690" y2="139"/>
  <line class="w" x1="690" y1="139" x2="690" y2="190"/>
  <line class="w" x1="678" y1="190" x2="702" y2="190"/><line class="w" x1="690" y1="180" x2="690" y2="200"/>
  <text class="tl" x="696" y="196">2.2nF</text>
  <line class="w" x1="690" y1="139" x2="730" y2="139"/>
  <line class="w" x1="730" y1="139" x2="730" y2="230"/>
  <rect class="ic" x="716" y="230" width="28" height="8"/><text class="tl" x="720" y="237">2.2k</text>
  <line class="w" x1="744" y1="234" x2="770" y2="234"/>
  <line class="w" x1="600" y1="160" x2="640" y2="160"/>
  <rect class="ic" x="640" y="154" width="24" height="10"/><text class="tl" x="644" y="162">220</text>
  <line class="w" x1="664" y1="159" x2="690" y2="159"/>
  <line class="w" x1="690" y1="159" x2="690" y2="190"/>
  <line class="w" x1="690" y1="159" x2="750" y2="159"/>
  <line class="w" x1="750" y1="159" x2="750" y2="210"/>
  <rect class="ic" x="736" y="210" width="28" height="8"/><text class="tl" x="740" y="217">2.2k</text>
  <line class="w" x1="764" y1="214" x2="770" y2="214"/>
  <line class="w" x1="770" y1="214" x2="770" y2="159"/>

  <rect class="ic" x="770" y="120" width="170" height="120"/>
  <text class="pn" x="780" y="142">U21A OPA1612</text>
  <text class="tl" x="780" y="156">差转单(G=1) 2.2k×4+330pF</text>
  <line class="w" x1="770" y1="160" x2="750" y2="160"/><text class="tl" x="752" y="155">−IN</text>
  <line class="w" x1="770" y1="180" x2="750" y2="180"/><text class="tl" x="752" y="175">+IN(GND参考2.2k)</text>
  <line class="w" x1="850" y1="160" x2="860" y2="160"/><text class="tl" x="852" y="155">±5VA</text>
  <line class="w" x1="940" y1="160" x2="990" y2="160"/><text class="t" x="944" y="154">OUT_L(SE)</text>

  <!-- R 路差转单（简化） -->
  <line class="w" x1="600" y1="200" x2="660" y2="200"/>
  <line class="w" x1="600" y1="220" x2="660" y2="220"/>
  <rect class="ic" x="660" y="185" width="80" height="50"/>
  <text class="tl" x="666" y="200">220Ω+2.2nF</text>
  <text class="tl" x="666" y="212">×2</text>
  <line class="w" x1="740" y1="210" x2="770" y2="210"/>
  <rect class="ic" x="770" y="250" width="170" height="120"/>
  <text class="pn" x="780" y="272">U21B OPA1612</text>
  <text class="tl" x="780" y="286">差转单 同左</text>
  <line class="w" x1="940" y1="290" x2="990" y2="290"/><text class="t" x="944" y="284">OUT_R(SE)</text>
  <line class="w" x1="850" y1="290" x2="860" y2="290"/><text class="tl" x="852" y="285">±5VA</text>

  <!-- K3 + J6 -->
  <rect class="ic" x="990" y="140" width="90" height="70"/>
  <text class="pn" x="1000" y="162">K3 静音</text>
  <text class="tl" x="1000" y="176">(常开, 上电500ms后闭)</text>
  <line class="w" x1="990" y1="160" x2="986" y2="160"/>
  <line class="w" x1="990" y1="180" x2="986" y2="180"/><text class="tl" x="976" y="196">←OUT_R 经开关</text>
  <line class="w" x1="1035" y1="210" x2="1035" y2="230"/><text class="tl" x="1040" y="226">线圈→S5 RELAY_MUTE</text>
  <line class="w" x1="1080" y1="160" x2="1140" y2="160"/><text class="t" x="1084" y="154">L</text>
  <line class="w" x1="1080" y1="180" x2="1140" y2="180"/><text class="t" x="1084" y="174">R</text>
  <rect class="ic" x="1140" y="120" width="120" height="100"/>
  <text class="pn" x="1150" y="142">J6 线路出</text>
  <text class="tl" x="1150" y="156">6.35 TRS×2(非平衡)</text>
  <text class="tl" x="1150" y="172">Tip=信号 Ring/S=GND</text>
  <line class="w" x1="1200" y1="220" x2="1200" y2="240"/><path class="w" d="M1185 240 h30 M1191 247 h18 M1194 254 h12"/><text class="t" x="1206" y="236">GND</text>

  <!-- 耳机支路 -->
  <line class="w" x1="940" y1="160" x2="940" y2="420"/>
  <line class="w" x1="940" y1="290" x2="940" y2="420"/>
  <rect class="ic" x="900" y="420" width="90" height="90"/>
  <text class="pn" x="908" y="442">RV1 RK097</text>
  <text class="tl" x="908" y="456">双联 10kA</text>
  <text class="tl" x="908" y="470">(模拟保底音量)</text>
  <line class="w" x1="990" y1="450" x2="1040" y2="450"/>
  <line class="w" x1="990" y1="480" x2="1040" y2="480"/>

  <!-- 输入 RC + U22 -->
  <line class="w" x1="1040" y1="450" x2="1080" y2="450"/>
  <rect class="ic" x="1080" y="444" width="24" height="10"/><text class="tl" x="1084" y="452">1k</text>
  <line class="w" x1="1104" y1="449" x2="1130" y2="449"/>
  <line class="w" x1="1130" y1="449" x2="1130" y2="500"/>
  <line class="w" x1="1118" y1="500" x2="1142" y2="500"/><line class="w" x1="1130" y1="490" x2="1130" y2="510"/>
  <text class="tl" x="1136" y="506">470pF</text>
  <line class="w" x1="1130" y1="449" x2="1180" y2="449"/><text class="t" x="1134" y="443">IN_L</text>
  <line class="w" x1="1040" y1="480" x2="1080" y2="480"/>
  <rect class="ic" x="1080" y="474" width="24" height="10"/><text class="tl" x="1084" y="482">1k</text>
  <line class="w" x1="1104" y1="479" x2="1130" y2="479"/>
  <line class="w" x1="1130" y1="479" x2="1130" y2="500"/>
  <line class="w" x1="1130" y1="479" x2="1180" y2="479"/><text class="t" x="1134" y="473">IN_R</text>

  <rect class="ic" x="1180" y="420" width="180" height="150"/>
  <text class="pn" x="1190" y="442">U22 TPA6120A2</text>
  <text class="tl" x="1190" y="456">耳机放大 G=2(Rf=Ri=1k)</text>
  <line class="w" x1="1180" y1="480" x2="1160" y2="480"/><text class="tl" x="1158" y="475">VCC+←+5VA</text>
  <line class="w" x1="1180" y1="520" x2="1160" y2="520"/><text class="tl" x="1158" y="515">VCC−←−5VA</text>
  <text class="tl" x="1190" y="500">⚠ 10µ+1µ+0.1µ 三级去耦毫米级贴身</text>
  <line class="w" x1="1360" y1="470" x2="1400" y2="470"/>
  <rect class="ic" x="1400" y="464" width="20" height="10"/><text class="tl" x="1370" y="462">10Ω串联</text>
  <line class="w" x1="1420" y1="469" x2="1405" y2="469"/>
  <line class="w" x1="1360" y1="500" x2="1395" y2="500"/>
  <rect class="ic" x="1395" y="494" width="20" height="10"/>
  <line class="w" x1="1415" y1="499" x2="1405" y2="499"/>
  <text class="t" x="1364" y="494">OUT_L/R</text>
  <rect class="ic" x="1290" y="600" width="110" height="90"/>
  <text class="pn" x="1300" y="622">J7 耳机</text>
  <text class="tl" x="1300" y="636">6.35 TRS</text>
  <line class="w" x1="1340" y1="600" x2="1340" y2="540"/><line class="w" x1="1340" y1="540" x2="1340" y2="530"/><text class="tl" x="1344" y="546">←OUT_L(10Ω)</text>
  <line class="w" x1="1355" y1="600" x2="1355" y2="540"/><text class="tl" x="1359" y="546">←OUT_R(10Ω)</text>
  <line class="off" x1="1345" y1="690" x2="1400" y2="690"/><text class="nt" x="1350" y="706">HP_DET→S5</text>
  <line class="w" x1="1345" y1="690" x2="1345" y2="666"/><text class="t" x="1350" y="662">Sleeve→GND</text>

  <!-- 防爆音状态机 -->
  <rect class="w" x="60" y="720" width="1200" height="190"/>
  <text class="tt" x="80" y="746">防爆音状态机（ESP32 实现）</text>
  <text class="t" x="80" y="770">上电: RST拉低 → I2C初始化 → 音量-60dB → 释放RST → 100ms → 闭K3 → ramp到默认-40dB</text>
  <text class="t" x="80" y="792">旋钮: 2ms/步 ramp；USB断连: 开K3 → ramp -60dB；静音键: ramp -∞ 档</text>
  <text class="t" x="80" y="814">检查点: 差转单 2.2k×4+330pF(fc≈219kHz)；DAC输出 220Ω+2.2nF；TPA6120 输出10Ω不省；</text>
  <text class="t" x="80" y="836">100M 晶振 V3V3A 供电且包地；AVCC 去耦贴身；LDO 输出电容保持 MLCC</text>
  <text class="tt" x="80" y="868">S7+S8 DAC 与输出 — ASIO-CARD v1</text>
</svg>
