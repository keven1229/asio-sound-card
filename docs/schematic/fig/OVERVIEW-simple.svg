  <rect x="1056" y="290" width="96" height="48" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="1104" y="312" text-anchor="middle" font-size="12" font-weight="bold">线路输出</text>
  <text x="1104" y="328" text-anchor="middle" font-size="10">TRS×2</text>

