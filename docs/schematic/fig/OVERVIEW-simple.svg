  <text x="30" y="28" font-size="18" font-weight="bold" fill="#0f172a">ASIO-CARD 直播声卡 · 简图（一页看懂）</text>

  <!-- ============ 面板 A：USB 与数字拓扑 ============ -->
  <rect x="30" y="50" width="610" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="50" width="610" height="34" rx="10" fill="#3b82f6"/>
  <text x="44" y="73" font-size="14" font-weight="bold" fill="#fff">① USB 与数字拓扑（一个口干四件事）</text>

  <rect x="50" y="110" width="110" height="60" rx="8" fill="#dbeafe" stroke="#334155"/>
  <text x="105" y="136" text-anchor="middle" font-size="13" font-weight="bold">电脑 PC</text>
  <text x="105" y="154" text-anchor="middle" font-size="10">ASIO·播放·直播</text>

  <rect x="200" y="110" width="110" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="255" y="136" text-anchor="middle" font-size="13" font-weight="bold">USB-C</text>
  <text x="255" y="154" text-anchor="middle" font-size="10">唯一接口</text>

  <rect x="370" y="100" width="130" height="100" rx="8" fill="#dbeafe" stroke="#334155"/>
  <text x="435" y="126" text-anchor="middle" font-size="14" font-weight="bold">CH334U</text>
  <text x="435" y="144" text-anchor="middle" font-size="11">4口 USB2.0 Hub</text>
  <text x="435" y="160" text-anchor="middle" font-size="10">12MHz 晶振</text>

  <line x1="160" y1="140" x2="200" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="310" y1="140" x2="370" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>

  <line x1="500" y1="135" x2="535" y2="135" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="500" y1="160" x2="535" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="500" y1="185" x2="535" y2="185" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="500" y1="210" x2="535" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>

  <rect x="535" y="113" width="100" height="44" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="585" y="131" text-anchor="middle" font-size="12" font-weight="bold">XU316</text>
  <text x="585" y="147" text-anchor="middle" font-size="10" fill="#1d4ed8">音频·480M</text>
  <rect x="535" y="163" width="100" height="44" rx="8" fill="#dbeafe" stroke="#334155"/>
  <text x="585" y="181" text-anchor="middle" font-size="12" font-weight="bold">ESP32-S3</text>
  <text x="585" y="197" text-anchor="middle" font-size="10">刷机·维护</text>
  <rect x="535" y="213" width="100" height="44" rx="8" fill="#dbeafe" stroke="#334155"/>
  <text x="585" y="231" text-anchor="middle" font-size="11" font-weight="bold">CH343P-A</text>
  <text x="585" y="247" text-anchor="middle" font-size="10">COM1→ESP32</text>
  <rect x="535" y="263" width="100" height="44" rx="8" fill="#dbeafe" stroke="#334155"/>
  <text x="585" y="281" text-anchor="middle" font-size="11" font-weight="bold">CH343P-B</text>
  <text x="585" y="297" text-anchor="middle" font-size="10">COM2→XU316调试</text>

  <text x="50" y="340" font-size="11" fill="#334155">· 音频走下游1（480M），Hub 只增加 &lt;1µs，不影响音质与延迟</text>
  <text x="50" y="362" font-size="11" fill="#334155">· 屏蔽壳直连 GND（预留 0Ω 位）；VBUS → 保护 → V5D，见③</text>
  <text x="50" y="384" font-size="11" fill="#334155">· 一根线 = 音频 + 刷机 + 两个独立调试 COM 口</text>
  <text x="50" y="420" font-size="10" fill="#64748b">CC1/CC2 各 5.1k 下拉（不加 ESD）；D± 用 PRTR5V0U2X 双通道 ESD</text>

  <!-- ============ 面板 B：音频信号流 ============ -->
  <rect x="660" y="50" width="610" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="660" y="50" width="610" height="34" rx="10" fill="#22c55e"/>
  <text x="674" y="73" font-size="14" font-weight="bold" fill="#fff">② 音频信号流（设备内混音 / 双回环）</text>

  <rect x="680" y="105" width="112" height="50" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="736" y="127" text-anchor="middle" font-size="12" font-weight="bold">备用输入</text>
  <text x="736" y="143" text-anchor="middle" font-size="10">线路 / Hi-Z</text>
  <rect x="812" y="105" width="128" height="50" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="876" y="127" text-anchor="middle" font-size="12" font-weight="bold">OPA1656</text>
  <text x="876" y="143" text-anchor="middle" font-size="10">缓冲+继电器切换</text>

  <rect x="680" y="190" width="112" height="50" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="736" y="212" text-anchor="middle" font-size="12" font-weight="bold">XLR 话筒</text>
  <text x="736" y="228" text-anchor="middle" font-size="10">+48V 幻象</text>
  <rect x="812" y="190" width="120" height="50" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="872" y="212" text-anchor="middle" font-size="12" font-weight="bold">PGA2500</text>
  <text x="872" y="228" text-anchor="middle" font-size="10">数字增益 0/10~65dB</text>

