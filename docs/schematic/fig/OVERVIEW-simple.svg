  <rect x="680" y="424" width="586" height="22" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="692" y="439" font-size="10.5" fill="#9a3412">设备内混音：话筒+备用+电脑播放 → 监听(零延迟) / 直播回环(给OBS) / 干声回环(给DAW)｜限幅防爆音</text>

