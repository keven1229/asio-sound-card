  <rect x="1050" y="370" width="110" height="40" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="1105" y="394" text-anchor="middle" font-size="11" font-weight="bold">TPA6120A2 耳放</text>
  <rect x="1180" y="370" width="86" height="40" rx="8" fill="#dcfce7" stroke="#334155"/>
  <text x="1223" y="394" text-anchor="middle" font-size="11" font-weight="bold">耳机</text>
  <line x1="1032" y1="390" x2="1050" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
