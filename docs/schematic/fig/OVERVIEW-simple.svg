<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 905" font-family="Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
