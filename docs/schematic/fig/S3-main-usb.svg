<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="Arial, sans-serif">
  <style>
    .w{stroke:#333;stroke-width:1.3;fill:none}
    .pw{stroke:#c00;stroke-width:2;fill:none}
    .t{font-size:10px;fill:#222}
    .tl{font-size:9px;fill:#555}
    .pn{font-size:9px;fill:#111;font-weight:bold}
    .ic{fill:#f6f8fa;stroke:#222;stroke-width:1.2}
    .nb{font-size:10px;fill:#c00;font-weight:bold}
    .nt{font-size:9px;fill:#333}
    .tt{font-size:15px;fill:#111;font-weight:bold}
    .off{stroke:#06c;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
  </style>

  <text class="tt" x="40" y="30">S3 XU316 主控 + USB Hub（引脚名以 datasheet / xk_audio_316_mc 为准）</text>

  <!-- ================= 左列：J1 信号 / ESD / Hub / 串口 ================= -->
  <!-- J1 信号侧 -->
  <rect class="ic" x="60" y="60" width="100" height="120"/>
  <text class="pn" x="70" y="82">J1 USB-C</text>
  <text class="tl" x="70" y="96">(电源脚见 S2)</text>
  <line class="w" x1="160" y1="76" x2="200" y2="76"/><text class="t" x="165" y="71">D+</text>
  <line class="w" x1="160" y1="96" x2="200" y2="96"/><text class="t" x="165" y="91">D−</text>
  <line class="w" x1="160" y1="122" x2="200" y2="122"/><text class="t" x="165" y="117">CC1</text>
  <line class="w" x1="160" y1="142" x2="200" y2="142"/><text class="t" x="165" y="137">CC2</text>
  <line class="w" x1="160" y1="162" x2="200" y2="162"/><text class="t" x="165" y="157">SH</text>

  <!-- CC 下拉 -->
  <line class="w" x1="200" y1="122" x2="230" y2="122"/>
  <line class="w" x1="230" y1="122" x2="230" y2="200"/>
  <rect class="ic" x="220" y="200" width="26" height="8"/><text class="tl" x="214" y="222">5.1k 1%</text>
  <line class="w" x1="246" y1="204" x2="268" y2="204"/>
  <path class="w" d="M253 204 h30 M259 211 h18 M262 218 h12"/>
  <line class="w" x1="200" y1="142" x2="260" y2="142"/>
  <line class="w" x1="260" y1="142" x2="260" y2="200"/>
  <rect class="ic" x="250" y="200" width="26" height="8"/><text class="tl" x="244" y="222">5.1k 1%</text>
  <line class="w" x1="276" y1="204" x2="298" y2="204"/>
  <path class="w" d="M283 204 h30 M289 211 h18 M292 218 h12"/>

  <!-- SH 0Ω -->
  <line class="w" x1="200" y1="162" x2="230" y2="162"/>
  <line class="w" x1="230" y1="162" x2="230" y2="235"/>
  <rect class="ic" x="220" y="235" width="26" height="8"/><text class="tl" x="213" y="257">0Ω(可换磁珠)</text>
  <line class="w" x1="246" y1="239" x2="268" y2="239"/>
  <path class="w" d="M253 239 h30 M259 246 h18 M262 253 h12"/>

  <!-- CMC 可选 + ESD -->
  <line class="w" x1="200" y1="76" x2="330" y2="76"/>
  <line class="w" x1="200" y1="96" x2="330" y2="96"/>
  <rect class="ic" x="236" y="70" width="36" height="30"/>
  <text class="tl" x="238" y="82">0Ω×2</text>
  <text class="tl" x="238" y="93">(CMC可选)</text>
  <rect class="ic" x="330" y="60" width="70" height="50"/>
  <text class="pn" x="338" y="78">U12</text>
  <text class="pn" x="338" y="90">PRTR5V0U2X</text>
  <text class="tl" x="338" y="102">(D±+CC)</text>
  <line class="w" x1="400" y1="76" x2="430" y2="76"/>
  <line class="w" x1="400" y1="96" x2="430" y2="96"/>
  <line class="w" x1="365" y1="110" x2="365" y2="130"/><line class="w" x1="350" y1="130" x2="380" y2="130"/>
  <path class="w" d="M352 130 h26 M358 137 h16 M361 144 h10"/>
  <text class="tl" x="383" y="120">GND</text>
  <line class="w" x1="365" y1="144" x2="365" y2="130"/>

  <!-- CH334U -->
  <line class="w" x1="430" y1="76" x2="430" y2="430"/>
  <line class="w" x1="430" y1="96" x2="430" y2="430"/>
  <rect class="ic" x="380" y="430" width="140" height="110"/>
  <text class="pn" x="390" y="452">U40 CH334U</text>
  <text class="tl" x="390" y="466">4口 USB2.0 HS Hub</text>
  <line class="w" x1="430" y1="446" x2="380" y2="446"/>
  <text class="tl" x="392" y="442">UP_D±</text>
  <line class="w" x1="450" y1="430" x2="450" y2="410"/><text class="tl" x="455" y="422">VDD←V3V3D 10µ+0.1µ</text>
  <line class="w" x1="490" y1="430" x2="490" y2="405"/>
  <line class="w" x1="490" y1="405" x2="520" y2="405"/>
  <rect class="ic" x="520" y="398" width="34" height="12"/><text class="tl" x="524" y="408">Y40 12MHz</text>
  <line class="w" x1="554" y1="404" x2="574" y2="404"/>
  <line class="w" x1="574" y1="404" x2="574" y2="430"/><text class="tl" x="578" y="420">(负载电容按手册)</text>
  <line class="w" x1="520" y1="466" x2="640" y2="466"/><text class="t" x="530" y="460">↓1 XU316_USB_D±</text>
  <line class="w" x1="520" y1="486" x2="640" y2="486"/><text class="t" x="530" y="480">↓2 USB_ESP_D±(→S5)</text>
  <line class="w" x1="520" y1="506" x2="620" y2="506"/><text class="t" x="530" y="500">↓3 →U41</text>
  <line class="w" x1="520" y1="526" x2="620" y2="526"/><text class="t" x="530" y="520">↓4 →U42</text>
  <line class="w" x1="450" y1="540" x2="450" y2="566"/>
  <path class="w" d="M435 566 h30 M441 573 h18 M444 580 h12"/><text class="t" x="456" y="590">GND</text>
  <text class="tl" x="380" y="600">下游 VBUS 全部直连 V5D，设备端 0.1µF 就近</text>

  <!-- CH343P-A/B -->
  <rect class="ic" x="60" y="660" width="150" height="100"/>
  <text class="pn" x="70" y="682">U41 CH343P-A</text>
  <text class="tl" x="70" y="696">USB转串口(免晶振)</text>
  <line class="w" x1="210" y1="690" x2="250" y2="690"/><text class="tl" x="215" y="684">UD± ←Hub↓3</text>
  <line class="w" x1="210" y1="715" x2="280" y2="715"/><text class="t" x="215" y="710">TXD→</text><text class="off" x1="280" y1="715" x2="330" y2="715"/><text class="nt" x="285" y="730">ESP_UART0_RX(S5)</text>
  <line class="w" x1="210" y1="735" x2="280" y2="735"/><text class="t" x="215" y="730">RXD←</text><text class="off" x1="280" y1="735" x2="330" y2="735"/><text class="nt" x="285" y="750">ESP_UART0_TX(S5)</text>
  <line class="w" x1="135" y1="660" x2="135" y2="645"/><text class="tl" x="140" y="655">VDD←V3V3D</text>
  <line class="w" x1="135" y1="760" x2="135" y2="776"/>
  <path class="w" d="M120 776 h30 M126 783 h18 M129 790 h12"/><text class="t" x="145" y="800">GND</text>

  <rect class="ic" x="60" y="830" width="150" height="100"/>
  <text class="pn" x="70" y="852">U42 CH343P-B</text>
  <text class="tl" x="70" y="866">USB转串口(免晶振)</text>
  <line class="w" x1="210" y1="860" x2="250" y2="860"/><text class="tl" x="215" y="854">UD± ←Hub↓4</text>
  <line class="w" x1="210" y1="885" x2="280" y2="885"/><text class="t" x="215" y="880">TXD→</text><text class="off" x1="280" y1="885" x2="330" y2="885"/><text class="nt" x="285" y="900">DEBUG_RX(U10)</text>
  <line class="w" x1="210" y1="905" x2="280" y2="905"/><text class="t" x="215" y="900">RXD←</text><text class="off" x1="280" y1="905" x2="330" y2="905"/><text class="nt" x="285" y="920">DEBUG_TX(U10)</text>
  <line class="w" x1="135" y1="830" x2="135" y2="815"/><text class="tl" x="140" y="825">VDD←V3V3D</text>
  <line class="w" x1="135" y1="930" x2="135" y2="946"/>
  <path class="w" d="M120 946 h30 M126 953 h18 M129 960 h12"/><text class="t" x="145" y="970">GND</text>

  <!-- ================= 右列：XU316 ================= -->
  <rect class="ic" x="620" y="60" width="240" height="420"/>
  <text class="pn" x="635" y="82">U10 XU316-1024-QF60A-C24</text>
  <text class="tl" x="635" y="96">(引脚号以 datasheet 为准)</text>

  <!-- USB -->
  <line class="w" x1="620" y1="130" x2="560" y2="130"/><text class="t" x="568" y="125">USB_DP/DN ←Hub↓1</text>
  <!-- 晶振 -->
  <line class="w" x1="860" y1="160" x2="940" y2="160"/>
  <rect class="ic" x="940" y="152" width="44" height="14"/><text class="tl" x="944" y="163">Y1 24MHz</text>
  <line class="w" x1="984" y1="159" x2="1010" y2="159"/>
  <line class="w" x1="1010" y1="159" x2="1010" y2="120"/><text class="t" x="940" y="146">XTAL_IN/OUT</text>
  <line class="w" x1="1010" y1="120" x2="860" y2="120"/>
  <!-- QSPI -->
  <line class="w" x1="860" y1="220" x2="960" y2="220"/><text class="t" x="866" y="214">QSPI_CS/CLK/D0-D3</text>
  <rect class="ic" x="960" y="196" width="90" height="48"/>
  <text class="pn" x="968" y="214">U11 W25Q16JV</text>
  <text class="tl" x="968" y="228">(CLK 串22Ω)</text>
  <line class="w" x1="1005" y1="244" x2="1005" y2="266"/><path class="w" d="M990 266 h30 M996 273 h18 M999 280 h12"/><text class="tl" x="1008" y="262">GND</text>
  <line class="w" x1="960" y1="252" x2="940" y2="252"/><text class="tl" x="930" y="248">WP#/HOLD#←V3V3D(10k)</text>
  <!-- I2S ADC -->
  <line class="off" x1="860" y1="300" x2="1060" y2="300"/><text class="t" x="866" y="294">ADC_BCLK/LRCK/MCLK →S4</text>
  <line class="off" x1="860" y1="320" x2="1060" y2="320"/><text class="t" x="866" y="314">ADC_DOUT ←S4</text>
  <line class="off" x1="860" y1="340" x2="1060" y2="340"/><text class="t" x="866" y="334">DAC_BCLK/LRCK/DIN →S5</text>
  <!-- UART -->
  <line class="off" x1="860" y1="370" x2="1060" y2="370"/><text class="t" x="866" y="364">CTRL_TX/RX ↔S5(921600)</text>
  <line class="w" x1="860" y1="390" x2="1000" y2="390"/><text class="t" x="866" y="384">DEBUG_TX/RX ←U42</text>
  <!-- xSYS -->
  <line class="w" x1="860" y1="420" x2="950" y2="420"/><text class="t" x="866" y="414">RST/TDI/TDO/TCK/TMS</text>
  <rect class="ic" x="950" y="404" width="80" height="32"/><text class="pn" x="958" y="424">J2 xSYS 2x3</text>
  <line class="w" x1="990" y1="436" x2="990" y2="456"/><path class="w" d="M975 456 h30 M981 463 h18 M984 470 h12"/><text class="tl" x="994" y="452">GND</text>
  <!-- RST -->
  <line class="w" x1="620" y1="450" x2="580" y2="450"/>
  <line class="w" x1="580" y1="450" x2="580" y2="480"/>
  <rect class="ic" x="566" y="480" width="28" height="8"/><text class="tl" x="556" y="500">10k←V3V3D</text>
  <line class="w" x1="580" y1="488" x2="580" y2="510"/>
  <path class="w" d="M565 510 h30 M571 517 h18 M574 524 h12"/>
  <text class="tl" x="520" y="470">RST_N</text>
  <line class="w" x1="640" y1="480" x2="670" y2="480"/><text class="tl" x="643" y="476">SW1 + 100nF(复位)</text>
  <!-- 电源 -->
  <line class="w" x1="620" y1="520" x2="600" y2="520"/><text class="t" x="560" y="524">VDD←V0V9(0.9V)</text>
  <line class="w" x1="620" y1="540" x2="600" y2="540"/><text class="t" x="552" y="544">VDDIO←V3V3D</text>
  <line class="w" x1="620" y1="560" x2="600" y2="560"/><text class="t" x="538" y="564">USB PHY/PLL 供电(磁珠)</text>
  <line class="w" x1="740" y1="480" x2="740" y2="500"/><path class="w" d="M725 500 h30 M731 507 h18 M734 514 h12"/><text class="t" x="750" y="494">GND</text>

  <!-- VBUS_SENSE -->
  <line class="pw" x1="1130" y1="60" x2="1130" y2="470"/>
  <text class="nb" x="1120" y="76">V5D</text>
  <line class="w" x1="1130" y1="100" x2="1180" y2="100"/>
  <line class="w" x1="1180" y1="100" x2="1180" y2="130"/>
  <rect class="ic" x="1170" y="130" width="28" height="8"/><text class="tl" x="1174" y="137">100k</text>
  <line class="w" x1="1198" y1="134" x2="1220" y2="134"/>
  <line class="w" x1="1220" y1="134" x2="1220" y2="100"/>
  <line class="w" x1="1220" y1="100" x2="1270" y2="100"/>
  <line class="w" x1="1270" y1="100" x2="1270" y2="130"/>
  <rect class="ic" x="1260" y="130" width="28" height="8"/><text class="tl" x="1264" y="137">100k</text>
  <line class="w" x1="1288" y1="134" x2="1310" y2="134"/>
  <path class="w" d="M1295 134 h30 M1301 141 h18 M1304 148 h12"/>
  <line class="w" x1="1220" y1="134" x2="1220" y2="170"/>
  <line class="off" x1="1220" y1="170" x2="1320" y2="170"/><text class="nt" x="1226" y="184">VBUS_SENSE→U10(1bit) + 10nF 对地</text>

  <!-- 备注框 -->
  <rect class="w" x="620" y="600" width="560" height="330"/>
  <text class="tt" x="640" y="626">S3 检查点</text>
  <text class="t" x="640" y="650">① 电源/晶振/QSPI/USB 接线对照 xk_audio_316_mc 官方原理图逐脚照抄</text>
  <text class="t" x="640" y="672">② 引脚预算 ~29/32：USB3~4+晶振2+QSPI6+I2S出6+I2S入1+UART2+调试UART2+xSYS5+RST1</text>
  <text class="t" x="640" y="694">③ 剩余 IO 引出测试排针；不足则砍 DEBUG_RX 或 VBUS_SENSE→ESP32</text>
  <text class="t" x="640" y="716">④ 上游差分 90Ω、ESD(U12) 距 J1 ≤10mm、flow-through；Hub→XU316 差分最短</text>
  <text class="t" x="640" y="738">⑤ 12MHz 与 24MHz 晶振远离模拟区；PRTR5V0U2X 双通道仅 D±（CC 不加 ESD）</text>
  <text class="t" x="640" y="760">⑥ CH343P×2 各串口线串 22Ω；下游 VBUS 直连 V5D</text>
  <text class="tt" x="640" y="792">S3 XU316 主控 + USB Hub — ASIO-CARD v1</text>
</svg>
