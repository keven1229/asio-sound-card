<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="Arial, sans-serif">
  <style>
    .w{stroke:#333;stroke-width:1.3;fill:none}
    .pw{stroke:#c00;stroke-width:2;fill:none}
    .t{font-size:10px;fill:#222}
    .tl{font-size:9px;fill:#555}
    .pn{font-size:9px;fill:#111;font-weight:bold}
    .ic{fill:#f6f8fa;stroke:#222;stroke-width:1.2}
    .nb{font-size:10px;fill:#c00;font-weight:bold}
    .nt{font-size:9px;fill:#333}
    .tt{font-size:15px;fill:#111;font-weight:bold}
    .off{stroke:#06c;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
    .ch{stroke:#080;stroke-width:1.4;fill:none}
  </style>

  <text class="tt" x="40" y="30">S4+S5+S6 模拟前端（信号顺序不可乱：EMI→6.81k→耦合→前置）</text>

  <!-- ================= 幻象 + K1 ================= -->
  <line class="pw" x1="80" y1="70" x2="80" y2="130"/>
  <text class="nb" x="60" y="65">PH48←S2(磁珠+10µF)</text>
  <rect class="ic" x="60" y="130" width="70" height="44"/>
  <text class="pn" x="68" y="148">K1 幻象</text>
  <text class="tl" x="68" y="160">(常开)</text>
  <line class="w" x1="130" y1="152" x2="190" y2="152"/><text class="nb" x="195" y="156">PH48_MIC</text>
  <line class="w" x1="95" y1="174" x2="95" y2="194"/><text class="tl" x="100" y="190">线圈→S5 RELAY_P48</text>

  <!-- ================= J4 话筒链 ================= -->
  <rect class="ic" x="60" y="230" width="110" height="150"/>
  <text class="pn" x="70" y="252">J4 Combo</text>
  <text class="tl" x="70" y="266">(XLR+6.35)</text>
  <line class="ch" x1="170" y1="246" x2="210" y2="246"/><text class="t" x="175" y="241">XLR2(+）</text>
  <line class="ch" x1="170" y1="266" x2="210" y2="266"/><text class="t" x="175" y="261">XLR3(−）</text>
  <line class="ch" x1="115" y1="380" x2="115" y2="410"/>
  <text class="t" x="120" y="406">XLR1→CHASSIS(AES48)</text>
  <text class="tl" x="120" y="420">(座体根部最短路径)</text>

  <!-- ch1 链：FB + 220pF + 6.81k + 47µF + 100k + BAV99 -->
  <rect class="ic" x="210" y="238" width="30" height="12"/><text class="tl" x="212" y="248">FB</text>
  <line class="w" x1="240" y1="244" x2="260" y2="244"/>
  <line class="w" x1="260" y1="244" x2="260" y2="210"/>
  <line class="w" x1="248" y1="210" x2="272" y2="210"/><line class="w" x1="260" y1="200" x2="260" y2="220"/>
  <text class="tl" x="266" y="216">220pF</text>
  <line class="w" x1="260" y1="244" x2="300" y2="244"/>
  <line class="w" x1="300" y1="244" x2="300" y2="290"/>
  <rect class="ic" x="288" y="290" width="30" height="10"/><text class="tl" x="292" y="298">6.81k</text>
  <text class="tl" x="292" y="284">0.1% 1206</text>
  <line class="w" x1="318" y1="295" x2="348" y2="295"/>
  <line class="w" x1="348" y1="295" x2="348" y2="244"/><text class="tl" x="330" y="310">←PH48_MIC</text>
  <line class="w" x1="348" y1="244" x2="380" y2="244"/>
  <line class="w" x1="380" y1="244" x2="380" y2="330"/>
  <line class="w" x1="368" y1="330" x2="392" y2="330"/><line class="w" x1="380" y1="320" x2="380" y2="340"/>
  <text class="tl" x="386" y="336">47µF/63V 双极性</text>
  <line class="w" x1="380" y1="244" x2="430" y2="244"/>
  <line class="w" x1="430" y1="244" x2="430" y2="290"/>
  <rect class="ic" x="418" y="290" width="26" height="8"/><text class="tl" x="414" y="310">100k泄放</text>
  <line class="w" x1="444" y1="294" x2="462" y2="294"/>
  <path class="w" d="M447 294 h30 M453 301 h18 M456 308 h12"/>
  <line class="w" x1="430" y1="244" x2="470" y2="244"/>
  <line class="w" x1="470" y1="244" x2="470" y2="280"/>
  <path class="w" d="M462 280 h16 M456 288 l12 0 M468 280 l-12 16 12 0 z"/>
  <line class="w" x1="470" y1="296" x2="470" y2="316"/>
  <path class="w" d="M455 316 h30 M461 323 h18 M464 330 h12"/>
  <text class="tl" x="477" y="286">ZD1 BAV99(钳±5VA)</text>
  <line class="w" x1="470" y1="244" x2="620" y2="244"/><text class="t" x="500" y="239">→U13 IN+</text>

  <!-- ch1 负支 -->
  <rect class="ic" x="210" y="258" width="30" height="12"/><text class="tl" x="212" y="268">FB</text>
  <line class="w" x1="240" y1="264" x2="260" y2="264"/>
  <line class="w" x1="260" y1="264" x2="260" y2="340"/>
  <line class="w" x1="248" y1="340" x2="272" y2="340"/><line class="w" x1="260" y1="330" x2="260" y2="350"/>
  <text class="tl" x="266" y="346">220pF</text>
  <line class="w" x1="260" y1="264" x2="318" y2="264"/>
  <line class="w" x1="318" y1="264" x2="318" y2="340"/>
  <rect class="ic" x="306" y="340" width="30" height="10"/><text class="tl" x="310" y="348">6.81k</text>
  <text class="tl" x="310" y="334">0.1% 1206</text>
  <line class="w" x1="336" y1="345" x2="366" y2="345"/>
  <line class="w" x1="366" y1="345" x2="366" y2="264"/><text class="tl" x="348" y="360">←PH48_MIC</text>
  <line class="w" x1="366" y1="264" x2="398" y2="264"/>
  <line class="w" x1="398" y1="264" x2="398" y2="380"/>
  <line class="w" x1="386" y1="380" x2="410" y2="380"/><line class="w" x1="398" y1="370" x2="398" y2="390"/>
  <text class="tl" x="404" y="386">47µF/63V 双极性</text>
  <line class="w" x1="398" y1="264" x2="448" y2="264"/>
  <line class="w" x1="448" y1="264" x2="448" y2="340"/>
  <rect class="ic" x="436" y="340" width="26" height="8"/><text class="tl" x="432" y="360">100k泄放</text>
  <line class="w" x1="462" y1="344" x2="480" y2="344"/>
  <path class="w" d="M465 344 h30 M471 351 h18 M474 358 h12"/>
  <line class="w" x1="448" y1="264" x2="488" y2="264"/>
  <line class="w" x1="488" y1="264" x2="488" y2="300"/>
  <path class="w" d="M480 300 h16 M474 308 l12 0 M486 300 l-12 16 12 0 z"/>
  <line class="w" x1="488" y1="316" x2="488" y2="336"/>
  <path class="w" d="M473 336 h30 M479 343 h18 M482 350 h12"/>
  <text class="tl" x="495" y="306">ZD2 BAV99</text>
  <line class="w" x1="488" y1="264" x2="620" y2="264"/><text class="t" x="520" y="259">→U13 IN−</text>

  <!-- ================= PGA2500 ================= -->
  <rect class="ic" x="620" y="160" width="190" height="140"/>
  <text class="pn" x="632" y="182">U13 PGA2500IDBR</text>
  <text class="tl" x="632" y="196">数控话筒前置 0/10~65dB 1dB步进</text>
  <line class="w" x1="620" y1="244" x2="600" y2="244"/><text class="tl" x="598" y="239">IN+</text>
  <line class="w" x1="620" y1="264" x2="600" y2="264"/><text class="tl" x="598" y="259">IN−</text>
  <line class="w" x1="810" y1="200" x2="860" y2="200"/><text class="t" x="814" y="194">VOUT+→100Ω→U15 IN1+</text>
  <line class="w" x1="810" y1="220" x2="860" y2="220"/><text class="t" x="814" y="214">VOUT−→100Ω→U15 IN1−</text>
  <line class="w" x1="715" y1="160" x2="715" y2="130"/><text class="t" x="720" y="144">VD+←V5D(5V)</text>
  <line class="w" x1="755" y1="160" x2="755" y2="130"/><text class="t" x="760" y="144">VA+←+5VA</text>
  <line class="w" x1="775" y1="160" x2="775" y2="130"/><text class="t" x="780" y="144">VA−←−5VA</text>
  <line class="off" x1="810" y1="260" x2="920" y2="260"/><text class="t" x="814" y="254">CS/SCLK/SDI/SDO →S5</text>
  <line class="w" x1="715" y1="300" x2="715" y2="316"/>
  <path class="w" d="M700 316 h30 M706 323 h18 M709 330 h12"/><text class="tl" x="720" y="336">VCOM→GND</text>
  <text class="tl" x="632" y="316">换挡防爆音：静音档过渡/过零特性(以手册为准)</text>

  <!-- ================= ES9822 ================= -->
  <rect class="ic" x="620" y="470" width="260" height="180"/>
  <text class="pn" x="632" y="492">U15 ES9822QPRO</text>
  <text class="tl" x="632" y="506">2ch ADC 123dB / 32bit</text>
  <line class="w" x1="700" y1="470" x2="700" y2="430"/><text class="t" x="705" y="450">IN1+/IN1− ←U13(串100Ω)</text>
  <line class="w" x1="760" y1="470" x2="760" y2="430"/><text class="t" x="765" y="450">IN2+/IN2− ←K2</text>
  <line class="off" x1="620" y1="540" x2="540" y2="540"/><text class="t" x="545" y="534">ADC_BCLK/LRCK/MCLK ←S3</text>
  <line class="off" x1="620" y1="560" x2="540" y2="560"/><text class="t" x="545" y="554">ADC_DOUT →S3</text>
  <line class="off" x1="880" y1="540" x2="960" y2="540"/><text class="t" x="884" y="534">I2C_SDA/SCL ↔S5</text>
  <line class="off" x1="880" y1="560" x2="960" y2="560"/><text class="t" x="884" y="554">RST_N ←S5</text>
  <line class="w" x1="880" y1="590" x2="960" y2="590"/><text class="nb" x="884" y="584">AVDD←V3V3A(磁珠+10µ+0.1µ)</text>
  <line class="w" x1="880" y1="610" x2="960" y2="610"/><text class="nb" x="884" y="604">DVDD←V1V8(必贴轨,兼供XU316)</text>
  <line class="w" x1="750" y1="650" x2="750" y2="676"/>
  <path class="w" d="M735 676 h30 M741 683 h18 M744 690 h12"/><text class="t" x="756" y="670">GND(VREF 10µ+0.1µ 就近)</text>

  <!-- ================= ch2 备用输入 ================= -->
  <rect class="ic" x="1010" y="230" width="110" height="120"/>
  <text class="pn" x="1020" y="252">J5 Combo</text>
  <text class="tl" x="1020" y="266">(线路/Hi-Z)</text>
  <line class="ch" x1="1120" y1="246" x2="1160" y2="246"/><text class="t" x="1124" y="241">Tip</text>
  <line class="ch" x1="1120" y1="266" x2="1160" y2="266"/><text class="t" x="1124" y="261">Ring</text>
  <line class="ch" x1="1065" y1="350" x2="1065" y2="380"/>
  <text class="t" x="1070" y="376">Sleeve→GND</text>
  <line class="ch" x1="1160" y1="246" x2="1190" y2="246"/><text class="tl" x="1194" y="242">T</text>
  <line class="ch" x1="1160" y1="266" x2="1190" y2="266"/><text class="tl" x="1194" y="262">R</text>

  <!-- U14 缓冲 -->
  <rect class="ic" x="1010" y="430" width="140" height="110"/>
  <text class="pn" x="1020" y="452">U14 OPA1656×2</text>
  <text class="tl" x="1020" y="466">跟随器(±5VA供电)</text>
  <line class="w" x1="1010" y1="460" x2="980" y2="460"/><text class="tl" x="958" y="455">线路: 10k入</text>
  <line class="w" x1="1010" y1="480" x2="980" y2="480"/><text class="tl" x="958" y="475">Hi-Z: 1M入</text>
  <line class="w" x1="1150" y1="460" x2="1200" y2="460"/><text class="t" x="1154" y="454">U14A out</text>
  <line class="w" x1="1150" y1="480" x2="1200" y2="480"/><text class="t" x="1154" y="474">U14B out</text>
  <line class="w" x1="1080" y1="540" x2="1080" y2="556"/>
  <path class="w" d="M1065 556 h30 M1071 563 h18 M1074 570 h12"/><text class="tl" x="1085" y="576">±5VA</text>
  <text class="tl" x="1020" y="556">输入各并100pF；ch2也串47µF耦合(短接0Ω可替)</text>

  <!-- K2 双模切换 -->
  <rect class="ic" x="1210" y="430" width="90" height="90"/>
  <text class="pn" x="1220" y="452">K2 双模</text>
  <text class="tl" x="1220" y="466">(DPDT 两刀全用)</text>
  <line class="w" x1="1210" y1="460" x2="1200" y2="460"/>
  <line class="w" x1="1210" y1="480" x2="1200" y2="480"/>
  <line class="w" x1="1300" y1="462" x2="1340" y2="462"/><text class="t" x="1304" y="456">→U15 IN2+</text>
  <line class="w" x1="1300" y1="482" x2="1340" y2="482"/><text class="t" x="1304" y="476">→U15 IN2−</text>
  <line class="w" x1="1255" y1="520" x2="1255" y2="540"/><text class="tl" x="1260" y="536">线圈→S5 RELAY_HIZ</text>
  <text class="tl" x="1210" y="512">刀2: Ring跟随器 / GND参考(1k)</text>

  <!-- BAV99 ch2 -->
  <line class="w" x1="1340" y1="462" x2="1340" y2="640"/>
  <line class="w" x1="1340" y1="482" x2="1340" y2="640"/>
  <path class="w" d="M1332 640 h16 M1326 648 l12 0 M1338 640 l-12 16 12 0 z"/>
  <path class="w" d="M1344 640 h16 M1338 648 l12 0 M1350 640 l-12 16 12 0 z"/>
  <line class="w" x1="1334" y1="656" x2="1334" y2="676"/>
  <line class="w" x1="1350" y1="656" x2="1350" y2="676"/>
  <path class="w" d="M1320 676 h60 M1326 683 h18 M1329 690 h12"/>
  <text class="tl" x="1355" y="646">ZD3/ZD4 BAV99</text>
  <line class="w" x1="1340" y1="462" x2="1380" y2="462"/>
  <line class="w" x1="1340" y1="482" x2="1380" y2="482"/>
  <line class="off" x1="1380" y1="472" x2="1420" y2="472"/><text class="nt" x="1376" y="496">→U15(右侧入)</text>

  <!-- K4 可选幻象 ch2 -->
  <text class="tl" x="1010" y="620">K4(可选): 同样 6.81k×2 ←PH48_MIC → ch2 耦合电容前</text>

  <!-- 备注框 -->
  <rect class="w" x="60" y="700" width="1180" height="260"/>
  <text class="tt" x="80" y="726">S4~S6 检查点</text>
  <text class="t" x="80" y="750">① 信号顺序：EMI(磁珠+220pF) → 6.81k 幻象注入 → 47µF 耦合 → 100k 泄放 → BAV99 → PGA2500</text>
  <text class="t" x="80" y="772">② 6.81k 用 1206 0.1% 薄膜（0.33W/只）；耦合电容双极性电解（不可换固态，发烧可换薄膜）</text>
  <text class="t" x="80" y="794">③ BAV99 钳位到 ±5VA（塑料机壳必备）；XLR pin1 → CHASSIS 座体根部（AES48）</text>
  <text class="t" x="80" y="816">④ PGA2500 输出串 100Ω 进 ADC；ES9822 差分输入各 100pF 对地</text>
  <text class="t" x="80" y="838">⑤ 布局：幻象 48V 与 XL6019 远离 PGA2500 输入；ES9822 VREF 电容贴身</text>
  <text class="t" x="80" y="860">⑥ 升级候选 B：THAT1570+THAT5173 替换 U13（EIN-127dBu、过零换挡），其余链路不动</text>
  <text class="tt" x="80" y="892">S4+S5+S6 模拟前端 — ASIO-CARD v1</text>
</svg>
