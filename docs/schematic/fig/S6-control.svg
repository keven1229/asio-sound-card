<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" font-family="Arial, sans-serif">
  <style>
    .w{stroke:#333;stroke-width:1.3;fill:none}
    .pw{stroke:#c00;stroke-width:2;fill:none}
    .t{font-size:10px;fill:#222}
    .tl{font-size:9px;fill:#555}
    .pn{font-size:9px;fill:#111;font-weight:bold}
    .ic{fill:#f6f8fa;stroke:#222;stroke-width:1.2}
    .nb{font-size:10px;fill:#c00;font-weight:bold}
    .nt{font-size:9px;fill:#333}
    .tt{font-size:15px;fill:#111;font-weight:900}
    .off{stroke:#06c;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
  </style>

  <text class="tt" x="40" y="30">S9+S10 ESP32-S3 控制 + 面板外设</text>

  <!-- U30 -->
  <rect class="ic" x="60" y="70" width="320" height="400"/>
  <text class="pn" x="72" y="92">U30 ESP32-S3-WROOM-1-N8R8</text>
  <text class="tl" x="72" y="106">(天线区净空, 非金属外壳开窗)</text>

  <line class="w" x1="60" y1="130" x2="40" y2="130"/><text class="t" x="44" y="125">GPIO19/20 ←USB_ESP_D±(S3)</text>
  <line class="w" x1="60" y1="150" x2="40" y2="150"/><text class="t" x="44" y="145">UART0 ←ESP_UART0(S3 CH343P-A)</text>
  <line class="off" x1="60" y1="170" x2="40" y2="170"/><text class="t" x="44" y="165">CTRL_TX/RX ↔XU316(S3) 921600</text>
  <line class="off" x1="60" y1="190" x2="40" y2="190"/><text class="t" x="44" y="185">I2C_SDA/SCL →S4/S5(2.2k上拉V3V3D)</text>
  <line class="off" x1="60" y1="210" x2="40" y2="210"/><text class="t" x="44" y="205">PGA_CS/SCLK/SDI/SDO →S4</text>
  <line class="off" x1="60" y1="230" x2="40" y2="230"/><text class="t" x="44" y="225">VBUS_SENSE ←S3(共用节点)</text>
  <line class="off" x1="60" y1="250" x2="40" y2="250"/><text class="t" x="44" y="245">PG ←S2 GM1205</text>
  <line class="w" x1="380" y1="140" x2="420" y2="140"/><text class="t" x="384" y="134">HP_DET ←S5</text>
  <line class="w" x1="380" y1="160" x2="420" y2="160"/><text class="t" x="384" y="154">LCD_SPI(SCK/MOSI/CS/DC/RST/BLK)</text>
  <line class="w" x1="380" y1="180" x2="420" y2="180"/><text class="t" x="384" y="174">ENC1/ENC2(A/B)</text>
  <line class="w" x1="380" y1="200" x2="420" y2="200"/><text class="t" x="384" y="194">BTN×4(内部上拉)</text>
  <line class="w" x1="380" y1="220" x2="420" y2="220"/><text class="t" x="384" y="214">LED×4</text>
  <line class="w" x1="380" y1="240" x2="430" y2="240"/><text class="t" x="384" y="234">RELAY_P48 / _HIZ / _MUTE / _P48B</text>
  <line class="w" x1="160" y1="70" x2="160" y2="50"/><text class="nb" x="165" y="60">V3V3D ←S2</text>
  <line class="w" x1="200" y1="70" x2="200" y2="50"/><text class="tl" x="205" y="60">10µF+0.1µF 就近</text>
  <line class="w" x1="240" y1="470" x2="240" y2="490"/>
  <line class="w" x1="226" y1="490" x2="254" y2="490"/><text class="tl" x="212" y="485">EN:10k↑V3V3D</text>
  <line class="w" x1="240" y1="490" x2="240" y2="516"/>
  <line class="w" x1="228" y1="516" x2="252" y2="516"/><line class="w" x1="240" y1="506" x2="240" y2="526"/>
  <text class="tl" x="246" y="522">1µF</text>
  <line class="w" x1="240" y1="516" x2="240" y2="540"/>
  <path class="w" d="M225 540 h30 M231 547 h18 M234 554 h12"/>
  <text class="t" x="246" y="566">GND</text>
  <line class="w" x1="300" y1="470" x2="300" y2="492"/><text class="tl" x="305" y="488">复位按键(可选)</text>

  <!-- LCD -->
  <rect class="ic" x="420" y="120" width="180" height="110"/>
  <text class="pn" x="430" y="142">LCD1 ST7789 1.3''</text>
  <text class="tl" x="430" y="156">240×240 IPS</text>
  <text class="tl" x="430" y="170">VCC←V3V3D BL←PWM</text>
  <line class="w" x1="420" y1="160" x2="380" y2="160"/>
  <text class="tl" x="430" y="188">UI: 状态行+VU表+增益/音量</text>

  <!-- 编码器/按键/LED -->
  <rect class="ic" x="420" y="280" width="160" height="80"/>
  <text class="pn" x="430" y="302">SW2/3 EC11×2</text>
  <text class="tl" x="430" y="316">耳机音量/话筒增益</text>
  <text class="tl" x="430" y="330">A/B 10k上拉+100nF, C=GND</text>
  <line class="w" x1="420" y1="310" x2="380" y2="310"/><line class="w" x1="380" y1="310" x2="380" y2="180"/>
  <rect class="ic" x="420" y="400" width="160" height="70"/>
  <text class="pn" x="430" y="422">SW4-7 按键×4</text>
  <text class="tl" x="430" y="436">幻象/Hi-Z/静音/菜单</text>
  <line class="w" x1="420" y1="430" x2="380" y2="430"/><line class="w" x1="380" y1="430" x2="380" y2="200"/>
  <rect class="ic" x="420" y="500" width="160" height="60"/>
  <text class="pn" x="430" y="522">LED1-4</text>
  <text class="tl" x="430" y="536">电源/48V/USB/过载(红闪)</text>
  <line class="w" x1="420" y1="525" x2="380" y2="525"/><line class="w" x1="380" y1="525" x2="380" y2="220"/>

  <!-- 继电器驱动 -->
  <text class="tt" x="660" y="60">继电器驱动（×4 相同）</text>
  <line class="w" x1="660" y1="90" x2="660" y2="120"/>
  <rect class="ic" x="644" y="120" width="32" height="10"/><text class="tl" x="648" y="128">1k</text>
  <line class="w" x1="676" y1="125" x2="710" y2="125"/>
  <line class="w" x1="710" y1="125" x2="710" y2="160"/>
  <line class="w" x1="700" y1="160" x2="720" y2="160"/><rect class="ic" x="700" y="156" width="20" height="8"/><text class="tl" x="703" y="163">100k↓</text>
  <line class="w" x1="720" y1="160" x2="720" y2="140"/><text class="tl" x="724" y="150">G</text>
  <rect class="ic" x="710" y="160" width="50" height="34"/>
  <text class="pn" x="716" y="182">Q1 2N7002</text>
  <line class="w" x1="760" y1="172" x2="790" y2="172"/><text class="tl" x="766" y="166">D</text>
  <line class="w" x1="735" y1="194" x2="735" y2="214"/>
  <path class="w" d="M720 214 h30 M726 221 h18 M729 228 h12"/><text class="tl" x="742" y="208">S</text>
  <line class="w" x1="790" y1="172" x2="830" y2="172"/><text class="tl" x="796" y="186">K1线圈−</text>
  <rect class="ic" x="830" y="150" width="90" height="44"/>
  <text class="pn" x="838" y="168">K1 HFD4/5</text>
  <text class="tl" x="838" y="180">(线圈)</text>
  <line class="w" x1="875" y1="150" x2="875" y2="120"/>
  <line class="pw" x1="830" y1="120" x2="940" y2="120"/><text class="nb" x="836" y="114">V5D</text>
  <line class="w" x1="830" y1="120" x2="830" y2="172"/><text class="tl" x="804" y="140">SS14续流</text>
  <path class="w" d="M826 116 l-12 8 12 0 z"/><line class="w" x1="826" y1="116" x2="826" y2="108"/><line class="w" x1="826" y1="108" x2="875" y2="108"/>
  <text class="tl" x="660" y="212">Q2/Q3/Q4 同构：K2(Hi-Z) K3(静音) K4(幻象2可选)</text>
  <text class="tl" x="660" y="228">线圈一律 V5D 5V；触点去 S4/S5</text>

  <!-- UART 协议表 -->
  <rect class="w" x="660" y="280" width="740" height="330"/>
  <text class="tt" x="680" y="306">UART 协议（XU316 ↔ ESP32，921600-8N1）</text>
  <text class="t" x="680" y="330">帧：| 0xAA | CMD | LEN | PAYLOAD | CRC8(0x07) | 0x55 |（小端）</text>
  <text class="t" x="680" y="352">0x01 ESP→XU 设置混音矩阵: 10电平(0~255, 源序Mic/Line/Main/Backing/Game×监听/直播) + 限幅阈值/使能</text>
  <text class="t" x="680" y="374">0x02 ESP→XU 查询状态 | 0x03 恢复出厂混音</text>
  <text class="t" x="680" y="396">0x11 XU→ESP VU(30~50Hz): mic/line/streamMixL/R/monitorL/R(2B dBFS×100) + clip标志</text>
  <text class="t" x="680" y="418">0x12 XU→ESP 状态: usb连接/采样率族/当前速率/固件版本 | 0x13 事件: USB断连/恢复/ASIO启停</text>
  <text class="t" x="680" y="440">ESP→XU 命令 CRC 失败重发一次；50ms 未收到 0x11 判定通信异常并在屏显告警</text>
  <text class="t" x="680" y="470">音量/增益控制路径: ES9039 数字音量(I2C, 2ms/步 ramp)；PGA2500 增益(SPI位段)；RV1 模拟保底</text>
  <text class="t" x="680" y="492">电平表: XU316 峰值上报 → LVGL 柱状 + 过载红闪 + LED4 同步</text>

  <!-- 检查点 -->
  <rect class="w" x="60" y="660" width="1340" height="250"/>
  <text class="tt" x="80" y="686">S9+S10 检查点</text>
  <text class="t" x="80" y="710">① I2C 2.2k 上拉 V3V3D，挂 ES9822+ES9039（地址错开）；PGA2500 四线独立 GPIO 位段</text>
  <text class="t" x="80" y="732">② 继电器驱动远离 PGA2500 输入；线圈 SS14 续流；栅极 1k+100k 下拉</text>
  <text class="t" x="80" y="754">③ 屏幕 FPC/旋钮位置先对 3D 外壳再锁坐标；ESP32 天线区净空（外壳开窗或非金属）</text>
  <text class="t" x="80" y="776">④ 上电时序: ESP32 读 PG → 使能 XL6019 → 100ms → K1；断电反向；常开继电器兜底</text>
  <text class="t" x="80" y="798">⑤ VBUS_SENSE 与 XU316 共用分压节点（二选一定点）</text>
  <text class="tt" x="80" y="832">S9+S10 ESP32-S3 控制 + 面板 — ASIO-CARD v1</text>
</svg>
